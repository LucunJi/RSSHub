name: Fetch upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '5 5 * * FRI'  # At 05:05 AM, only on Friday

env:
  UPSTREAM_REPO: https://github.com/DIYgod/RSSHub.git
  UPSTREAM_BRANCH: master

jobs:
  fetch:
    permissions:
      contents: write  # for Git to git push
    name: Auto Fetch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          # use custom PAT to trigger other workflows when pushing, see https://github.com/orgs/community/discussions/37103
          token: ${{ secrets.FETCH_UPSTREAM_GITHUB_PAT }}
          fetch-depth: 100
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Fetch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch --depth=100 --no-tags "${{ env.UPSTREAM_REPO }}" "${{ env.UPSTREAM_BRANCH }}:upstream"
      - name: Merge
        run: |
          # ignore and regenerate lock file
          # credits: https://gist.github.com/tmaybe/4c9d94712711229cd506
          echo pnpm-lock.yaml merge=ours > .gitattributes
          git config merge.ours.driver true
          git merge --no-commit -m "Merge upstream ${{ env.UPSTREAM_REPO }} ${{ env.UPSTREAM_BRANCH }}" --into master upstream

          pnpm i
          git add pnpm-lock.yaml
          git merge --continue
      - name: Push
        run: |
          git push
